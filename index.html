<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Matters | Your Well-being is Priority</title>
    <meta name="description" content="A gentle reminder that your mental health matters. Take a breath, seek support, and prioritize your well-being.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <div class="content">
                <h1 id="main-title">Mental Health <span class="highlight">Matters</span></h1>
                <p class="subtitle">Your journey is valid. Your feelings are real. You are enough.</p>
                <div class="cta-group">
                    <a href="#" class="btn btn-primary" id="btn-explore">Take a Breath</a>
                    <a href="#" class="btn btn-secondary" id="btn-support">Find Support</a>
                </div>
            </div>
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Kindness & Care. Take care of yourself.</p>
    </footer>
    <script>
        document.getElementById('btn-explore').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Take a deep breath... Inhale for 4, Hold for 4, Exhale for 4. You are doing great.');
        });
    </script>
</body>
</html>
